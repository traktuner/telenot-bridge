name: Continuous Integration (CI)

on:
    push:
        branches:
            - main
            - feature/*
    pull_request:
        branches:
            - main
            - feature/*

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Check out code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: '26'

            - name: Cache Yarn dependencies
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: |
                      ~/.cache/yarn
                      node_modules
                  key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-yarn-

            - name: Setup configuration
              run: mv src/config-example src/config

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Run Jest tests
              run: yarn test
              continue-on-error: false

    docker-build:
        # Builds the image without a push, so that a Dockerfile error shows up before a merge.
        runs-on: ubuntu-latest

        steps:
            - name: Check out code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

            - name: Build the image
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
              with:
                  context: .
                  file: ./Dockerfile
                  platforms: linux/amd64
                  push: false
