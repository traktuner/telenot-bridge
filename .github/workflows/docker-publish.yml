name: Build and Publish Docker Image

# Every push to main publishes ghcr.io/<owner>/<repo>:latest and :sha-<commit>.
# A tag vX.Y.Z also publishes :X.Y.Z and creates a GitHub release.
# On the first day of each month the image is rebuilt from main without a cache. The newest base
# image and the newest operating system packages go into it. The run creates the next patch tag
# (for example v0.3.0 becomes v0.3.1), publishes :0.3.1 and creates a GitHub release.
on:
    schedule:
        - cron: '23 3 1 * *'
    push:
        branches:
            - main
        tags:
            - 'v*.*.*'
    workflow_dispatch:

permissions:
    contents: write
    packages: write

concurrency:
    group: docker-publish-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build-and-publish:
        runs-on: ubuntu-latest

        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0

            - name: Compute the version of the monthly rebuild
              id: monthly
              if: github.event_name == 'schedule'
              run: |
                  latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
                  if [ -z "$latest" ]; then
                      echo "No release tag found" >&2
                      exit 1
                  fi
                  IFS=. read -r major minor patch <<< "${latest#v}"
                  echo "version=${major}.${minor}.$((patch + 1))" >> "$GITHUB_OUTPUT"

            - name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: '26'

            - name: Setup configuration
              run: mv src/config-example src/config

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Run tests
              run: yarn test

            - name: Restore the example configuration for the image
              run: mv src/config src/config-example

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Compute image tags and labels
              id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=sha,format=long
                      type=semver,pattern={{version}}
                      type=raw,value=${{ steps.monthly.outputs.version }},enable=${{ github.event_name == 'schedule' }}

            - name: Build and push Docker image to GHCR
              id: build
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
              with:
                  context: .
                  file: ./Dockerfile
                  platforms: linux/amd64
                  push: true
                  pull: true
                  no-cache: ${{ github.event_name == 'schedule' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Show the image digest
              run: |
                  echo "Image: ghcr.io/${{ github.repository }}" >> "$GITHUB_STEP_SUMMARY"
                  echo "Digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

            - name: Resolve the release tag
              id: release
              env:
                  MONTHLY_VERSION: ${{ steps.monthly.outputs.version }}
              run: |
                  if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
                      tag="v${MONTHLY_VERSION}"
                  elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
                      tag="$GITHUB_REF_NAME"
                  else
                      tag=""
                  fi
                  echo "tag=${tag}" >> "$GITHUB_OUTPUT"
                  echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

            - name: Tag the monthly rebuild
              if: github.event_name == 'schedule'
              env:
                  RELEASE_TAG: ${{ steps.release.outputs.tag }}
              run: |
                  git tag "$RELEASE_TAG"
                  git push origin "$RELEASE_TAG"

            - name: Create GitHub Release
              if: steps.release.outputs.tag != ''
              uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
              with:
                  tag: ${{ steps.release.outputs.tag }}
                  name: Release ${{ steps.release.outputs.tag }}
                  body: |
                      Version ${{ steps.release.outputs.tag }} of the Docker image is available as
                      `ghcr.io/${{ github.repository }}:${{ steps.release.outputs.version }}`.
                      Digest: `${{ steps.build.outputs.digest }}`
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
